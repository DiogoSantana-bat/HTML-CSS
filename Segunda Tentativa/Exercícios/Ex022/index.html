<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixes</title>
    <style>
        h1{
            background-color: aquamarine;
            height: 300px;
            width: 300px;
            text-align: center;

            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            border: 10px, solid, darkslategray;
            /*Shorthand: Border - width -> style -> color*/

            padding-top: 4px;
            padding-right: 4px;
            padding-bottom: 4px;
            padding-left: 4px;

            padding: 4px 4px 4px 4px;
            /*Shorthand: Padding - top -> right -> bottom -> left*/
            
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 30px;
            margin-left: 20px;

            margin: 20px 20px 30px 20px;
            /*Shorthand: Margin - top -> right -> bottom -> left*/
            
            outline-width: 5px;
            outline-style: dotted;
            outline-color: cornflowerblue;

            outline: 5px, dotted, cornflowerblue;
            /*Shorthand: Outline - width -> style -> color */
        }
        a{
            display: block;
            width: 15px;
            height: 15px;
            border-width: 5px;
            border-style: dashed;
            border-color: brown;
            padding-top: 4px;
            padding-right: 4px;
            padding-bottom: 4px;
            padding-left: 4px;
        }
    </style>
</head>
<body>
    <h1>Modelo de Caixes</h1>
    <p>Parágrafos podem ser considerados um exemplo de box-levem, porém, os <a href="#">links são um exemplo de inline-level</a>. Vamos ver como tudo isso funfa.</p>
</body>
</html>
