<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: rgb(251, 128, 255);
            text-decoration: none;
            font-weight: bolder;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:visited{
            color: darkred;
        }

        a:active{
            color: yellow;
        }

        a.especial::before{
            content: ' ⇒';
            color: blueviolet;
        }

        a.especial::after{
            content:' ⇐';
            text-decoration: none;
            font-weight: normal;
            color: blueviolet;
        }

        .especial{
            background-color: rgb(141, 141, 255);
            color: white;
        }

        img{
            width: 150px;
        }
    </style>
</head>
