<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinamicas</h1>
    <p>Tente abrir esta merda em varios dispositivos ou mexe no zoom desta bosta</p>

    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <p><a href="pag002.html" target="_self" rel="next">Página 2</a></p>
    <h1>Reproduzindo audio</h1>
    <p>Como colocar músicas legais no seu site e tomar processos</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="Mídia/nohospital.mp3" type="audio/mpeg">
        <p>Então, meu nobre, seu navegador é fudido e nem consegue abrir um audio sozinho, mas se você quiser, clique <a href="Mídia/nohospital.mp3">aqui</a> para baixar seu audio</p>
    </audio>
    <!--compatível com mp3, wav e ogg-->
</body>
</html>
